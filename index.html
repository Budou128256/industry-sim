<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>工業シミュレーション基盤 — Phase 1</title>
<style>
  :root{
    --bg:#0f1117; --panel:#161a23; --panel2:#1d222d; --line:#2a3140;
    --fg:#e7ebf3; --muted:#93a0b4;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 "Segoe UI","Yu Gothic UI",system-ui,sans-serif;
       background:var(--bg);color:var(--fg);overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:8px 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;white-space:nowrap}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 42px)}
  aside{border-right:1px solid var(--line);background:var(--panel);
        overflow-y:auto;padding:10px 12px;min-height:0}
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;
       border-bottom:1px solid var(--line);background:var(--panel)}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
  button:hover{border-color:#4a5568}
  #board{flex:1;display:block;width:100%;height:100%;cursor:crosshair}
  .group{color:var(--muted);font-size:12px;margin:10px 0 4px}
  .pal{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:3px;
       border:1px solid transparent;background:transparent;text-align:left}
  .pal:hover{background:var(--panel2)}
  .pal.sel{border-color:#d4b13f;background:#262c3a}
  .pal i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.4);flex:none}
  .pal .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal .sz{color:var(--muted);font-size:11px}
  .hint{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.8}
  #status{color:var(--muted);font-size:12.5px;margin-left:auto;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>工業シミュレーション基盤</h1>
  <span class="sub">Phase 1 — Grid / Building / Item / Placement</span>
</header>

<div class="wrap">
  <aside>
    <div id="palette"></div>
    <div class="hint">
      左クリック: 設置（ドラッグで連続）<br>
      右クリック: 撤去<br>
      R: 回転（カーソルの下 / 選択中の向き）<br>
      ホイール: 拡大縮小<br>
      Shift + ドラッグ: 画面を動かす<br>
      Esc: 選択を解除
    </div>
  </aside>

  <main>
    <div class="bar">
      <button id="btnRotate">回転 (R)</button>
      <button id="btnClear">全消去</button>
      <span class="sub">建物 <b id="count">0</b></span>
      <span id="status">読み込み中…</span>
    </div>
    <canvas id="board"></canvas>
  </main>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
